{% load static %}
{% load functions %}
<div class="modal-dialog modal-lg modal-dialog-centered">
	<div id="modal-content-md" class="modal-content">
		<form id="form" class="form-horizontal wizard" action="{% url 'perm_servicos' %}" method="post">
			{% csrf_token %}
			<div class="modal-header">
				{% if form.instance.id %}
					<input type="hidden" name="user" value="{{form.instance.id}}">
				{% endif %}
				<div>
					<h5 class="modal-title">{{card_title}}</h5>
					<small>{{subtitle}}</small>
				</div>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<!-- ============================================================== -->
				<!-- Container fluid  -->
				<!-- ============================================================== -->
				<div class="card p-3 table-responsive">
					<table id="listagem_servicos" class="table table-striped table-bordered">
						<thead>
							<tr>
								<th class="col-1"></th>
								<th class="col-6">Descrição</th>
								<th class="col-5">Cliente</th>
							</tr>
						</thead>
						<tbody>
							{% for item in tipos_servicos %}
								<tr>
									<td class="py-1 align-middle col-1"><input type="checkbox" name="tipos_servicos" 
										value="{{item.id}}" {% if item.id in tipos_servicos_selected %} checked {% endif %}></td>
									<td class="py-1 align-middle col-6">{{item.descricao}}</td>
									<td class="py-1 align-middle col-5">{{item.cliente.nome}}</td>
								</tr>
							{% endfor %}
						</tbody>
					</table>
				</div>
				<!-- ============================================================== -->
				<!-- End Page Content -->
				<!-- ============================================================== -->
			</div>
			<!-- ============================================================== -->
			<!-- End Container fluid  -->
			<!-- ============================================================== -->

			<div class="modal-footer">
			<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
			<button type="submit" class="btn btn-primary">
				Salvar
			</button>
			</div>
		</form>
	</div>
</div>

<script>
	$("#listagem_servicos").DataTable({
		language: CUSTOM_DATATABLE,
		order: [[1, 'asc']],
		paging: false,
	});

</script>
