<!DOCTYPE html>
{% load static %}
<html dir="ltr" lang="en">
	<head>
			<meta charset="utf-8" />
			<meta http-equiv="X-UA-Compatible" content="IE=edge" />
			<!-- Tell the browser to be responsive to screen width -->
			<meta name="viewport" content="width=device-width, initial-scale=1" />
			<meta
				name="keywords"
				content="wrappixel, admin dashboard, html css dashboard, web dashboard, bootstrap 5 admin, bootstrap 5, css3 dashboard, bootstrap 5 dashboard, Matrix lite admin bootstrap 5 dashboard, frontend, responsive bootstrap 5 admin template, Matrix admin lite design, Matrix admin lite dashboard bootstrap 5 dashboard template"
			/>
			<meta
				name="description"
				content="Matrix Admin Lite Free Version is powerful and clean admin dashboard template, inpired from Bootstrap Framework"
			/>
			<meta name="robots" content="noindex,nofollow" />
			<title>G-Calc</title>
			<!-- Favicon icon -->
			<link
				rel="icon"
				type="image/png"
				sizes="16x16"
				href="{% static 'assets/images/favicon.png' %}"
			/>
			<!-- Custom CSS -->
			<link href="{% static 'assets/libs/select2/dist/css/select2.min.css' %}" rel="stylesheet" type="text/css">
			<link href="{% static 'assets/libs/flot/css/float-chart.css' %}" rel="stylesheet" />
			<link href="{% static "dist/css/style.min.css"%}" rel="stylesheet" />
			<link href="{% static "assets/libs/toastr/build/toastr.min.css"%}" rel="stylesheet">
			<link href="{% static 'assets/libs/jquery-steps/jquery.steps.css' %}" rel="stylesheet"/>
			<link href="{% static "dist/css/jquery-ui.css"%}" rel="stylesheet">

			{% block css %}{% endblock %}

	</head>

  <body>
    <style>
      html {
        height:100%;
      }

      body {
        margin:0;
      }

      .bg {
        animation:slide 3s ease-in-out infinite alternate;
        background-image: linear-gradient(-60deg, rgb(51, 122, 204) 50%, #1f262d 50%);
        bottom:0;
        left:-50%;
        opacity:.5;
        position:fixed;
        right:-50%;
        top:0;
        z-index:-1;
      }

      .bg2 {
        animation-direction:alternate-reverse;
        animation-duration:4s;
      }

      .bg3 {
        animation-duration:5s;
      }

      .content {
        background-color:rgba(32, 32, 32, 0.8);
        border-radius:.25em;
        box-shadow:0 0 .25em rgba(0,0,0,.25);
        box-sizing:border-box;
        left:50%;
        padding:10vmin;
        position:fixed;
        text-align:center;
        top:50%;
        transform:translate(-50%, -50%);
      }

      h1 {
        font-family:monospace;
      }

      @keyframes slide {
        0% {
          transform:translateX(-25%);
        }
        100% {
          transform:translateX(25%);
        }
      }
    </style>
    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <div class="content">
      <div class="auth-box border-top border-secondary">
          <div class="text-center pt-3" style="display: grid;">
              <span class="db col-12">
                {% include 'base/logo_login.html' %}
              </span>
            </div>
          <div id="loginform">
            
            <!-- Form -->
            <form
              class="form-horizontal my-3"
              id="loginform" method="post">
              {% csrf_token %}
              <div class="row pb-4">
                <div class="col-12">
                  <div class="input-group mb-3">
                    <div class="input-group-prepend">
                      <span
                        class="input-group-text bg-success text-white h-100"
                        id="basic-addon1">
                        <i class="mdi mdi-account fs-4"></i>
                      </span>
                    </div>
                    <input
                      type="text"
                      id="id_username"
                      name="username"
                      class="form-control form-control-lg"
                      placeholder="{{ form.username.label }}"
                      aria-label="Username"
                      aria-describedby="basic-addon1"
                      autocomplete="username"
                      required />
                  </div>
                  <div class="input-group mb-3">
                    <div class="input-group-prepend">
                      <span
                        class="input-group-text bg-warning text-white h-100"
                        id="basic-addon2"
                        ><i class="mdi mdi-lock fs-4"></i
                      ></span>
                    </div>
                    <input
                      type="password"
                      id="id_password"
                      name="password"
                      class="form-control form-control-lg"
                      placeholder="{{ form.password.label }}"
                      aria-label="Password"
                      aria-describedby="basic-addon1"
                      autocomplete="current-password"
                      required />
                  </div>
                </div>
              </div>
              <div class="row border-top border-secondary">
                <div class="col-12">
                  <div class="form-group">
                    <div class="pt-3">
                      <!--<button
                        class="btn btn-info"
                        id="to-recover"
                        type="button"
                      >
                        <i class="mdi mdi-lock fs-4 me-1"></i> Lost password?
                      </button>-->
                      <button
                        class="btn btn-success float-end text-white"
                        type="submit"
                      >
                        Login
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <!--<div id="recoverform" style="display: none">
            <div class="text-center">
              <span class="text-white"
                >Digite seu endereço de e-mail abaixo e lhe enviaremos instruções sobre como recuperar uma senha.</span
              >
            </div>
            <div class="row mt-3">
              <form class="col-12" action="index.html">
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span
                      class="input-group-text bg-danger text-white h-100"
                      id="basic-addon1"
                      ><i class="mdi mdi-email fs-4"></i
                    ></span>
                  </div>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    placeholder="Email Address"
                    aria-label="Username"
                    aria-describedby="basic-addon1"
                  />
                </div>
                <div class="row mt-3 pt-3 border-top border-secondary">
                  <div class="col-12 form-group">
                    <a
                      class="btn btn-success text-white"
                      href="#"
                      id="to-login"
                      name="action"
                      >Back To Login</a
                    >
                    <button
                      class="btn btn-info float-end"
                      type="button"
                      name="action"
                    >
                      Recover
                    </button>
                  </div>
                </div>
              </form>-
            </div>
          </div>-->
        </div>

    </div>
    <!-- ============================================================== -->
    <!-- All Required js -->
    <!-- ============================================================== -->
    {% include 'base/scripts.html' %}
    <!-- ============================================================== -->
    <!-- This page plugin js -->
    <!-- ============================================================== -->
    <script>
      $(".preloader").fadeOut();
      // ==============================================================
      // Login and Recover Password
      // ==============================================================
      $("#to-recover").on("click", function () {
        $("#loginform").hide();
        $("#recoverform").fadeIn();
      });
      $("#to-login").click(function () {
        $("#recoverform").hide();
        $("#loginform").fadeIn();
      });
    </script>
  </body>
</html>
