{% load static %}
<!-- ============================================================== -->
<!-- Topbar header - style you can find in pages.scss -->
<!-- ============================================================== -->
<header class="topbar" data-navbarbg="skin5">
	<nav class="navbar top-navbar navbar-expand-md navbar-dark">
		<div class="navbar-header" data-logobg="skin5">
				{% include 'base/logo.html' %}
				<!-- ============================================================== -->
				<!-- Toggle which is visible on mobile only -->
				<!-- ============================================================== -->
				<a
				class="nav-toggler waves-effect waves-light d-block d-md-none"   
				href="javascript:void(0)"
				><i class="ti-menu ti-close"></i
				></a>
		</div>
		<!-- ============================================================== -->
		<!-- End Logo -->
		<!-- ============================================================== -->
		<div
				class="navbar-collapse collapse"
				id="navbarSupportedContent"
				data-navbarbg="skin5"
		>
				<!-- ============================================================== -->
				<!-- toggle and nav items -->
				<!-- ============================================================== -->
				<ul class="navbar-nav float-start me-auto">
					<li class="nav-item d-none d-md-block">
							<a
							class="nav-link sidebartoggler waves-effect waves-light"   
							href="javascript:void(0)"
							data-sidebartype="mini-sidebar"
							><i class="mdi mdi-menu font-24"></i
							></a>
					</li>
				</ul>

				<ul class="navbar-nav float-end">

					<!-- ============================================================== -->
					<!-- User profile and search -->
					<!-- ============================================================== -->
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle text-muted waves-effect waves-dark pro-pic" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="true">
							<span class="mx-2">Olá {{ user.first_name }}</span>
						<img src="{% static '/assets/images/users/1.jpg' %}" alt="user" class="rounded-circle" width="31">
						</a>
						<ul class="dropdown-menu dropdown-menu-end user-dd animated" aria-labelledby="navbarDropdown">
							<div class="dropdown-divider"></div>
							<form method="post" action="{% url 'logout' %}">
								{% csrf_token %}
								<button class="dropdown-item" type="submit"><i class="fa fa-power-off me-1 ms-1"></i> Logout</button>
							</form>
							<div class="dropdown-divider"></div>
						</ul>
					</li>
					<!-- ============================================================== -->
					<!-- User profile and search -->
					<!-- ============================================================== -->
				</ul>
		</div>
	</nav>
</header>
<!-- ============================================================== -->
<!-- End Topbar header -->
<!-- ============================================================== -->
