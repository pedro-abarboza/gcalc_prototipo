{% load static %}
<div class="modal-dialog modal-md modal-dialog-centered">
	<div id="modal-content-md" class="modal-content">
		<form id="form" class="form-horizontal wizard">
			{% csrf_token %}
			<div class="modal-header">
				<h5 class="modal-title">{{card_title}}</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body py-0">
				<!-- ============================================================== -->
				<!-- Container fluid  -->
				<!-- ============================================================== -->
				<div class="container-fluid">
					<!-- ============================================================== -->
					<!-- Start Page Content -->
					<!-- ============================================================== -->
					<div class="card">
						<div class="form-group mt-3 row">
							<label>{{form.fields.cliente.label}}</label>
							<div class="col-12">
								<select name='cliente' class="form-control select2" id="cliente" required style="width: 100%;">
									<option value="">-----</option>
									{% for item in form.fields.cliente.choices.queryset %}
										<option value="{{item.id}}" 
											{% if form.instance.cliente.id|safe == item.id|safe %}selected{%endif%}>{{item.descricao}}</option>
									{% endfor %}
								</select>
							</div>
						</div>

						<div class="form-group mt-3 row">
							<label>{{form.fields.tipo_servico.label}}</label>
							<div class="col-12">
								<select name='tipo_servico' class="form-control select2" id="tipo_servico" required style="width: 100%;">
									<option value="">-----</option>
									{% for item in form.fields.tipo_servico.choices.queryset %}
										<option value="{{item.id}}" 
											{% if tipo_servico_id|safe == item.id|safe %}selected{%endif%}>{{item.descricao}}</option>
									{% endfor %}
								</select>
							</div>
						</div>

						<div class="form-group mt-3">
							<label>{{form.fields.cliente.label}}</label>
							<input name='cliente' type="text" class="form-control autocomplete" 
								id="cliente" required
							>
						</div>

						<div class="form-group mt-3">
							<label>{{form.fields.processo.label}}</label>
							<input name='processo' type="text" class="form-control processo-inputmask" 
								id="processo" required
							>
						</div>
						
						<div class="form-group mt-3">
							<label>{{form.fields.dt_prazo.label}}</label>
							<input name='dt_prazo' type="text" class="form-control datepicker date-inputmask" 
								id="dt_prazo" required
							>
						</div>

						<div class="form-group mt-3">
							<label>{{form.fields.observacao.label}}</label>
							<input name='observacao' type="text" class="form-control" id="observacao">
						</div>
					</div>
				</div>
				<!-- ============================================================== -->
				<!-- End Page Content -->
				<!-- ============================================================== -->
			</div>
			<!-- ============================================================== -->
			<!-- End Container fluid  -->
			<!-- ============================================================== -->

			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
				<button type="submit" class="btn btn-primary">
					Salvar
				</button>
			</div>
		</form>
	</div>
</div>

<script>
	$( function() {
		$(".datepicker").datepicker({
			language: 'pt-BR'
		});
		$(".select2").select2();
		$(".processo-inputmask").inputmask("9999999-99.9999.9.99.9999")
	});
</script>
