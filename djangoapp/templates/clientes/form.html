{% load static %}

<div class="modal-dialog modal-md modal-dialog-centered">
	<div id="modal-content-md" class="modal-content">
		<form id="form" class="form-horizontal wizard" action="{{url_form}}" method="post">
			{% csrf_token %}
			<div class="modal-header">
				{% if form.instance.id %}
					<input type="hidden" name="pk" value="{{form.instance.id}}">
				{% endif %}
				<div>
					<h4 class="modal-title">{{card_title}}</h4>
					<small>{{subtitle}}</small>
				</div>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body py-0">
				<!-- ============================================================== -->
				<!-- Container fluid  -->
				<!-- ============================================================== -->
				<div class="container-fluid">
					<!-- ============================================================== -->
					<!-- Start Page Content -->
					<!-- ============================================================== -->
					<div class="card">
						<div class="form-group mt-3">
							<label>{{form.fields.nome.label}}</label>
							<input name="nome" type="text" class="form-control" maxlength={{form.fields.nome.max_length}}
								id="nome" placeholder="Digite o Nome do Cliente" required value="{{form.instance.nome}}"
							>
						</div>

						<div class="form-group mt-3">
							<label>{{form.fields.cpf.label}}</label>
							<input name='cpf' type="text" class="form-control cpf-inputmask" id="cpf" value={{form.instance.cpf|default_if_none:''}}>
						</div>

						<div class="form-group mt-3">
							<label>{{form.fields.cnpj.label}}</label>
							<input name='cnpj' type="text" class="form-control cnpj-inputmask" id="cnpj" value={{form.instance.cnpj|default_if_none:''}}>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
				<button type="submit" class="btn btn-primary">
					Salvar
				</button>
			</div>
		</form>
	</div>
</div>
